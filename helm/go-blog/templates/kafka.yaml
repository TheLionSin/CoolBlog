# 1. HEADLESS SERVICE (Лучше тоже сделать уникальным)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-headless # <--- Добавили шаблон
  labels:
    app: {{ .Release.Name }}-kafka
spec:
  ports:
    - port: 9092
      name: plaintext
    - port: 9093
      name: controller
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-kafka
---
# 2. ОБЫЧНЫЙ СЕРВИС (Твой ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-service
  labels:
    app: {{ .Release.Name }}-kafka
spec:
  ports:
    - port: 9092
      name: plaintext
  selector:
    app: {{ .Release.Name }}-kafka
---
# 3. Statefulset
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kafka # <--- Имя StatefulSet тоже уникальное!
spec:
  serviceName: {{ .Release.Name }}-kafka-headless # <--- Ссылка на Headless сервис выше
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-kafka
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: "controller,broker"
            # ВНИМАНИЕ: Ссылка на headless для голосования.
            # Формат адреса пода: {pod-name}.{headless-service-name}.default.svc.cluster.local
            # Имя пода будет: {{ .Release.Name }}-kafka-0
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@{{ .Release.Name }}-kafka-0.{{ .Release.Name }}-kafka-headless.default.svc.cluster.local:9093"

            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"

            # САМОЕ ГЛАВНОЕ ИСПРАВЛЕНИЕ 👇
            - name: KAFKA_ADVERTISED_LISTENERS
              # Теперь Кафка говорит свой правильный адрес: my-blog-kafka-service
              value: "PLAINTEXT://{{ .Release.Name }}-kafka-service:9092"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"