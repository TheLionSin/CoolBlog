{{- range $name, $config := .Values.workers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Генерируем имя: my-release-publisher, my-release-consumer
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app: {{ $.Release.Name }}-{{ $name }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $name }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          # Тут подставляем команду (consumer или publisher)
          command: {{ $config.command | toJson }}
          env:
            # Копируем глобальные настройки
            - name: DB_HOST
              value: {{ $.Values.global.env.DB_HOST | quote }}
            - name: DB_USER
              value: {{ $.Values.global.env.DB_USER | quote }}
            - name: DB_PASSWORD
              value: "postgres"
            - name: DB_NAME
              value: {{ $.Values.global.env.DB_NAME | quote }}
            - name: DB_PORT
              value: {{ $.Values.global.env.DB_PORT | quote }}
            - name: KAFKA_BROKERS
              value: {{ $.Values.global.env.KAFKA_BROKERS | quote }}
            - name: REDIS_ADDR
              value: {{ $.Values.global.env.REDIS_ADDR | quote }} # Пока хардкод, это норм
{{- end }}