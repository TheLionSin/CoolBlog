apiVersion: apps/v1
kind: Deployment
metadata:
  # Добавляем шаблон имени
  name: {{ .Release.Name }}-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      # Метка тоже должна быть уникальной
      app: {{ .Release.Name }}-grafana
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
---
apiVersion: v1
kind: Service
metadata:
  # Имя сервиса теперь динамическое!
  name: {{ .Release.Name }}-grafana-service
spec:
  selector:
    # Ищет поды с новой меткой
    app: {{ .Release.Name }}-grafana
  ports:
    - port: 3000
      targetPort: 3000