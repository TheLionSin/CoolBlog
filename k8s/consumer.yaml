apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-blog-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-blog-consumer
  template:
    metadata:
      labels:
        app: go-blog-consumer
    spec:
      containers:
        - name: consumer
          image: go_blog_app:k8s
          imagePullPolicy: Never
          command: ["consumer"] # <- Запускаем бинарник consumer

          env:
            # Копипаст переменных (в реальном K8s это делают через ConfigMap, но пока так)
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: DB_NAME
              value: "go_blog_db"
            - name: DB_PORT
              value: "5432"
            - name: REDIS_ADDR
              value: "redis-service:6379"
            - name: KAFKA_BROKERS
              value: "kafka-service:9092"
            - name: KAFKA_GROUP_ID
              value: "blog_group"